name: 功能建议
description: 说明使用场景、问题、范围和可验证的完成标准。
title: "[Feature] "
body:
  - type: input
    id: task
    attributes:
      label: 关联任务或讨论
      description: 已有 M 编号、Issue 或需求文档链接；没有则留空。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景和问题
      description: 谁在什么情况下遇到什么问题？目前如何解决？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望的行为和收益
      description: 描述操作前后变化，建议本身不等于已批准需求。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与兼容影响
      description: 本次需要做什么？是否涉及已有内容块、模板、数据或接口约定？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 如何验证该问题被解决？请给出具体操作或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考
      description: 可选；不要提交敏感文档或凭据。
